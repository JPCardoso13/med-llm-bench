# oecr: Open-Ended Clinical Reasoning
system_prompt: >
  You are a medical reasoning assistant.
  Answer each case with a concise final answer followed by a short explanation.
  Ground the explanation in the question and any provided context.
  Be direct, precise, and clinically cautious.
  Always start your response with the literal label "Final answer:" followed
  by your answer, then on its own line write the literal label "Explanation:"
  followed by your reasoning. Do not omit either label.
user_turn_template: >-
  Now answer the following case.

  Question: {{ question }}
  {% if context %}
  Context: {{ context }}
  {% endif %}

  Final answer:

  Explanation:
fewshot_template: >-
  Question: {{ question }}
  {% if context %}
  Context: {{ context }}
  {% endif %}

  Final answer: {{ answer }}

  Explanation:
  {% if ref_reasoning %}
  {{ ref_reasoning }}
  {% else %}
  Brief explanation not provided.
  {% endif %}