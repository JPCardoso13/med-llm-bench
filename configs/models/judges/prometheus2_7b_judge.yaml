engine: vllm
model_id: prometheus-eval/prometheus-7b-v2.0
backend_api: openai_compatible
# Optional secondary judge, sized for rtx4060/haslab - purpose-built
# evaluator model, held for a possible future LLM-jury (not the current
# single-judge setup). Not referenced by any run config yet.
# ~14GB BF16 weights leave only ~0.4GB/GPU headroom at TP=1; TP=2
# (~7GB/GPU) is used for a safe KV-cache margin instead.
tensor_parallel_size: 2
max_model_len: 16384
gpu_memory_utilization: 0.90
enforce_eager: false
# ~11MB/s measured on this cluster; 14GB raw ~21min, generous margin.
startup_timeout_s: 5400
