engine: vllm
model_id: openai/gpt-oss-20b
backend_api: openai_compatible
# Primary judge candidate for rtx4060/haslab - distinct from
# gpt_oss_120b_judge.yaml (too large for this hardware). 64 attention heads /
# 8 KV heads, ~12.8GB MXFP4 weights - TP=1 would leave only ~1.6GB/GPU
# headroom; TP=2 (~6.4GB/GPU) gives a safer margin for a judge that runs
# across every free-text sample in the benchmark.
tensor_parallel_size: 2
max_model_len: 16384
gpu_memory_utilization: 0.90
# CUDA graph capture (enforce_eager: false) OOM'd during
# compile_or_warm_up_model on 2026-08-18 despite healthy KV-cache headroom
# (6.75GiB free) - a separate memory spike from the dummy-sampler warmup
# max_num_seqs already fixes. SequentialRunner has zero real concurrency, so
# there's no throughput reason to want CUDA graphs here; disabling them
# trades a bit of per-token speed for reliability, which is the right trade
# for a judge that only needs to get through the run once.
enforce_eager: true
# ~11MB/s measured on this cluster; 12.8GB raw ~19min, generous margin.
startup_timeout_s: 5400
# gpt-oss-20b is a reasoning model (vLLM auto-enables its openai_gptoss
# reasoning parser) - the default 512-token completion budget was getting
# entirely consumed by reasoning before the model ever reached the final
# JSON answer, especially on longer/harder prompts (src's full-document
# summarization judging: 85%+ parse failure, vs oecr's short clinical
# cases: ~4%). 2048 gives real headroom for reasoning + the small JSON
# answer on even the hardest prompts.
max_tokens: 2048
