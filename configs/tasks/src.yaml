task_id: src
task_type: generative

prompt:
  config: configs/prompts/src.yaml

datasets:
  - name: pubmedsum
    config: configs/datasets/pubmedsum.yaml
    enabled: true
    eval_limit: null

  - name: multiclinsum
    config: configs/datasets/multiclinsum.yaml
    enabled: true
    eval_limit: null

execution:
  num_fewshot: 0
  flush_every: 10
  # Bumped 512->3072 (2026-09-08): same reasoning-model truncation risk as
  # cdkr (see that file's comment and RESEARCH_FINDINGS.md) - src's old
  # budget was even smaller than cdkr's, so likely the most exposed of the
  # three tasks. Not yet measured directly here.
  max_tokens: 3072
  fewshot_seed: 42  # inert while num_fewshot: 0

runtime:
  telemetry_config: configs/runtime/telemetry.auto.yaml

metrics:
  systems_profile: configs/metrics/systems.yaml
  cognitive_profile: configs/metrics/cognitive.generative.summarization.yaml
