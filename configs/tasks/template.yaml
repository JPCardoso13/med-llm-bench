task_id: task_name
task_type: mcq  # or generative

prompt:
  config: configs/prompts/task_name.yaml

datasets:
  - name: dataset_a
    config: configs/datasets/dataset_a.yaml
    enabled: true
    eval_limit: null  # per-dataset sample cap, null = full split
    # max_tokens: 768  # per-dataset override of execution.max_tokens below

  - name: dataset_b
    config: configs/datasets/dataset_b.yaml
    enabled: true
    eval_limit: null

execution:
  num_fewshot: 3
  flush_every: 10
  fewshot_seed: 42  # omit for unseeded/non-reproducible draws
  max_tokens: 1024
  max_consecutive_failures: 5  # optional, defaults to 5

runtime:
  # Point at the auto-generated file, not a hand-authored one.
  telemetry_config: configs/runtime/telemetry.auto.yaml

metrics:
  systems_profile: configs/metrics/systems.yaml
  # No standalone template profile - use cognitive.mcq.yaml or
  # cognitive.generative.yaml as a starting point instead.
  cognitive_profile: configs/metrics/cognitive.mcq.yaml
