# Resume for qwen3_6_27b_awq_quanttrio's oecr full redo at max_tokens: 8192
# (job 175621 hit its real 48h TIMEOUT with medcalcbench at 980/1100,
# medcasereasoning not started). medcalcbench resumes from eval_offset: 980;
# medcasereasoning runs fresh. Separate task_id so raw lands under
# raw/oecr_resume_175621/ to be merged by hand into
# outputs/175452_oecr_src/raw/oecr afterward (sample_id dedup on merge).
task_id: oecr_resume_175621
task_type: generative

prompt:
  config: configs/prompts/oecr.yaml

datasets:
  - name: medcalcbench
    config: configs/datasets/medcalcbench.yaml
    enabled: true
    eval_offset: 980
    eval_limit: null

  - name: medcasereasoning
    config: configs/datasets/medcasereasoning.yaml
    enabled: true
    eval_limit: null

execution:
  num_fewshot: 2
  flush_every: 10
  max_tokens: 8192
  fewshot_seed: 42

runtime:
  telemetry_config: configs/runtime/telemetry.auto.yaml

metrics:
  systems_profile: configs/metrics/systems.yaml
  cognitive_profile: configs/metrics/cognitive.generative.yaml
