schema_version: 1

task_id: oecr
task_type: generative

prompt:
  config: configs/prompts/oecr.yaml

datasets:
  - name: medcalcbench
    config: configs/datasets/medcalcbench.yaml
    enabled: true
    eval_limit: 10

  - name: medcasereasoning
    config: configs/datasets/medcasereasoning.yaml
    enabled: true
    eval_limit: 10

execution:
  num_fewshot: 2
  flush_every: 10
  max_tokens: 1024
  # Fixes which fewshot examples get drawn per sample, so reruns are
  # reproducible and every model sees the same fewshot examples per
  # question (fair comparison) instead of the previous unseeded behavior.
  fewshot_seed: 42

runtime:
  telemetry_config: configs/runtime/telemetry.auto.yaml

metrics:
  systems_profile: configs/metrics/systems.yaml
  cognitive_profile: configs/metrics/cognitive.generative.yaml