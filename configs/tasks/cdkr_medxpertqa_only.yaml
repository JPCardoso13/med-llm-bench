# Dataset-level resume workaround for cdkr (2026-09-08) - qwen3_6_27b_awq_quanttrio's
# 48h attempts keep finishing medqa (1273/1273, already saved) but never
# reaching the end of medxpertqa. The orchestrator has no per-dataset
# resume, but it does respect each dataset's `enabled` flag - this copy of
# cdkr.yaml disables medqa so a resume run only generates medxpertqa. Its
# task_id is deliberately NOT "cdkr" (that would overwrite the real
# raw/cdkr/*.json, which still only has medxpertqa's *old* incomplete data
# mixed in) - this run's raw output lands under raw/cdkr_medxpertqa_only/,
# safe to merge into raw/cdkr/ by hand afterward. Delete this file once the
# merge is done; it's a one-off, not a permanent task variant.
task_id: cdkr_medxpertqa_only

prompt:
  config: configs/prompts/cdkr.yaml

datasets:
  - name: medqa
    config: configs/datasets/medqa.yaml
    enabled: false
    eval_limit: null

  - name: medxpertqa
    config: configs/datasets/medxpertqa.yaml
    enabled: true
    eval_limit: null

execution:
  num_fewshot: 3
  flush_every: 10
  max_tokens: 3072
  fewshot_seed: 42

runtime:
  telemetry_config: configs/runtime/telemetry.auto.yaml

metrics:
  systems_profile: configs/metrics/systems.yaml
  cognitive_profile: configs/metrics/cognitive.mcq.yaml
