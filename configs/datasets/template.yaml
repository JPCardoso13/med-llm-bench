# Dataset config template. Use either hub_path or data_files under source.

source:
  name: "my_dataset_name"
  hub_path: "Organization/DatasetName"
  subset: "OptionalSubset"

  # data_files: "data/my_dataset.parquet"
  # data_files:
  #   eval: "data/eval_set.jsonl"
  #   fewshot: "data/fewshot_set.jsonl"

splits:
  eval: "test"
  fewshot: "train"

schema: "MCQSample"  # or "GenerativeSample"

# preprocess_script: "utils/custom_transforms/my_dataset_transform.py"

mapping:
  id: "raw_id_column"
  question: "prompt_text"

  # MCQ
  options: "choices_dict"
  answer_idx: "correct_key"

  # Generative
  # answer: "ground_truth"
  # context: "reference_text"

  # Grouping fields get stratified breakdowns; metadata fields don't.
  grouping:
    category: "domain_column"
  metadata:
    url: "source_link"
