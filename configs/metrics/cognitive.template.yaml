schema_version: 1

# Stable profile identifier. Convention: cognitive.{task_type}.{variant}
# Examples: cognitive.mcq, cognitive.generative, cognitive.mcq.with_judge
profile_id: cognitive.template
scope: cognitive

# MCQ or generative; controls which metrics are available.
task_type: mcq

enabled: true

# MCQ-specific metrics (omit for generative tasks).
mcq:
  enabled: true
  accuracy:
    enabled: true
    # Extract predicted answer from model response and compare to ref_fields.answer_idx
  parsing:
    enabled: true
    # Track when answer extraction fails or is ambiguous

# Generative-specific metrics (omit for MCQ tasks). All implemented and
# individually gateable - set enabled: false on any block to skip it.
# generative:
#   enabled: true
#   exact_match:
#     enabled: true
#     lowercase: true
#     normalize_whitespace: true
#     strip_punctuation: true
#   answer_token_f1:
#     enabled: true
#     lowercase: true
#     normalize_whitespace: true
#     strip_punctuation: true
#   rouge:
#     enabled: false
#     variants: [rouge1, rouge2, rougeL]
#     use_stemmer: true

# extraction.final_answer.on_multiline controls what happens when the
# extracted final answer spans multiple lines:
#   truncate_first_line (default) - keep only the first line, flag as
#     contaminated. Suits short QA-style final answers where extra lines
#     usually mean unlabeled explanation bleed-through.
#   join - join all lines with a space, still flagged as contaminated for
#     diagnostics. Suits long-form answers (e.g. summaries) where multiple
#     lines are legitimate content, not a parsing failure.

# Not implemented yet - requires a bertscore dependency.
# semantic_similarity:
#   enabled: false
#   metric_name: bertscore
#   language: en

# LLM-as-a-judge: offline pass, run separately via scripts/llm_judge_run.py
# after the main benchmarking run. rubric items are categorical labels, not
# numeric scores - see configs/metrics/cognitive.generative.yaml (OECR) and
# cognitive.generative.summarization.yaml (SRC) for real, working examples.
llm_judge:
  enabled: false
  judge_prompt_config: configs/prompts/judge/task_name_judge.yaml
  rubric:
    example_item:
      enabled: true
      labels: [Poor, Fair, Good, Excellent]

quality_checks:
  fail_on_missing_ref_fields: false
  warn_on_parse_failures: true
  warn_on_extraction_ambiguity: true
