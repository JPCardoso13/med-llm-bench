profile_id: cognitive.generative.summarization
scope: cognitive
task_type: generative

enabled: true

# Per-value breakdowns for whatever grouping fields the dataset defines -
# auto-discovered, not named here.
enable_grouping: true

# Whether parsing-diagnostic counts appear in output. Not yet wired - the
# calculator always includes this block today.
include_parsing_summary: true

# output_tokens/input_tokens - how much the model condensed its input.
# input_tokens is the full formatted prompt (document + instructions), not
# the document alone, but for this task (no fewshot, minimal system-prompt
# overhead) it's a reasonable proxy.
compression: true

# Whole response IS the summary verbatim (src.yaml forbids headers). Unlike
# a short QA answer, multi-line is legitimate content here, so on_multiline
# joins instead of truncating.
extraction:
  answer:
    pattern: (?is)^(.*)$
    trim: true
    on_multiline: join

reporting:
  enabled: true
  top_k_worst: 20
  top_k_best: 5
  include_per_sample: false
  per_sample_limit: 1000
  include_text_preview: true
  text_preview_chars: 300

# One list entry per text-comparison metric, each a (name, target) pair.
# target must match a name under extraction: and a BenchmarkResult.ref_fields
# key (today: answer, ref_reasoning). New metric = new entry, not a new block.
similarity:
  enabled: true
  metrics:
    - name: exact_match
      target: answer
      # Meaningless on a full free-text summary (~0% unless verbatim).
      enabled: false
      lowercase: true
      normalize_whitespace: true
      strip_punctuation: true
    - name: token_f1
      target: answer
      enabled: true
      lowercase: true
      normalize_whitespace: true
      strip_punctuation: true
    - name: rouge
      target: answer
      enabled: true
      variants: [rouge1, rouge2, rougeL]
      use_stemmer: true

llm_judge:
  enabled: true
  judge_prompt_config: configs/prompts/judge/src_judge.yaml
  rubric:
    coverage:
      enabled: true
      labels: [Poor, Fair, Good, Excellent]
    faithfulness:
      enabled: true
      labels: [Poor, Fair, Good, Excellent]

quality_checks:
  fail_on_missing_ref_fields: false
