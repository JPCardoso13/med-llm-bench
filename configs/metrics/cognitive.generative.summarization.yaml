profile_id: cognitive.generative.summarization
scope: cognitive
task_type: generative

enabled: true

# Auto-discovers whatever grouping fields the dataset defines.
enable_grouping: true

# Not yet wired - the calculator always includes this block today.
include_parsing_summary: true

compression: true  # output_tokens/input_tokens

extraction:
  answer:
    pattern: (?is)^(.*)$
    trim: true
    # last_paragraph (2026-09-21): un-tagged reasoning models (Qwen3.6 AWQ
    # builds) emit numbered planning steps as separate paragraphs ahead of
    # the real summary, with no <think> tag for clean_response_text() to
    # strip. "join" scored that whole blob (0% answer_clean_rate on both
    # Qwen models, every src dataset) - last_paragraph takes just the final
    # paragraph, verified against real samples to reliably match the
    # model's actual final answer. See RESEARCH_FINDINGS.md.
    on_multiline: last_paragraph

reporting:
  enabled: true
  top_k_worst: 20
  top_k_best: 5
  include_per_sample: false
  per_sample_limit: 1000
  include_text_preview: true
  text_preview_chars: 300

# target must match a name under extraction: and a ref_fields key.
similarity:
  enabled: true
  metrics:
    - name: exact_match
      target: answer
      enabled: false  # meaningless on a full free-text summary
      lowercase: true
      normalize_whitespace: true
      strip_punctuation: true
    - name: token_f1
      target: answer
      enabled: true
      lowercase: true
      normalize_whitespace: true
      strip_punctuation: true
    - name: rouge
      target: answer
      enabled: true
      variants: [rouge1, rouge2, rougeL]
      use_stemmer: true
    - name: bertscore
      target: answer
      enabled: true

llm_judge:
  enabled: true
  judge_prompt_config: configs/prompts/judge/src_judge.yaml
  rubric:
    coverage:
      enabled: true
      labels: [Poor, Fair, Good, Excellent]
    faithfulness:
      enabled: true
      labels: [Poor, Fair, Good, Excellent]

quality_checks:
  fail_on_missing_ref_fields: false
