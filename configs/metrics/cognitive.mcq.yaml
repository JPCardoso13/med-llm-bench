profile_id: cognitive.mcq
scope: cognitive
task_type: mcq

enabled: true

# Auto-discovers whatever grouping fields the dataset defines.
enable_grouping: true

# Parsing always runs; this only toggles whether success/failure counts are reported.
include_parsing_summary: true

extraction:
  # v2 (2026-09-08): \b(?!\w) (v1, 2026-09-04) still let the captured letter
  # BE a complete one-letter English word, since a space right after it also
  # satisfies "not a word char" - "answer a multiple-choice question"
  # matched "a" -> "A". This is systematic on reasoning models, whose
  # responses almost always open with "...answer a ..."; on Qwen3.6-35B-AWQ
  # cdkr/medqa it silently deflated measured accuracy from a real ~56% (spot
  # check) down to 22.7%. Fix: require the captured letter be followed by a
  # closing paren (clear option-marker intent, e.g. "B) Cholesterol...") OR
  # immediately by clause-ending punctuation/newline/end-of-string - i.e. a
  # letter followed by more lowercase prose with no punctuation ("a
  # multiple-choice...") no longer matches. Trade-off: some genuinely
  # unpunctuated answers now read as "missing" instead of extracted - safe,
  # since missing only shrinks the sample size while the old bug corrupted
  # the accuracy value itself.
  answer_patterns:
    - 'final\s+answer\s*(?:is|was)?\s*[:\-]?\s*\(?\s*([A-J])(?:\)|(?=[.,:;\n]|$))'
    - 'answer\s*(?:is|was)?\s*[:\-]?\s*\(?\s*([A-J])(?:\)|(?=[.,:;\n]|$))'
    - 'option\s*(?:is|was)?\s*[:\-]?\s*\(?\s*([A-J])(?:\)|(?=[.,:;\n]|$))'
    - '^\s*\(?\s*([A-J])\s*\)?\s*$'

reporting:
  enabled: true
  top_k_worst: 20
  top_k_best: 5
  include_per_sample: false
  per_sample_limit: 1000
  include_text_preview: true
  text_preview_chars: 220

mcq:
  enabled: true
  accuracy: true
  precision: true  # averaging is hard-coded to macro
  recall: true
  f1: true
  label_bias: true  # predicted vs. correct letter distribution

llm_judge:
  enabled: false

quality_checks:
  fail_on_missing_ref_fields: false
