schema_version: 1

profile_id: cognitive.mcq
scope: cognitive
task_type: mcq

enabled: true

# Per-value metric breakdowns for whatever grouping fields a dataset config
# actually defines (BenchmarkResult.grouping, from that dataset's
# mapping.grouping block) - e.g. medxpertqa's body_system/medical_task/
# question_type, medqa's meta_info. Nothing to name here; fields with no
# data for a given dataset just don't appear.
enable_grouping: true

# Ordered regex patterns tried against the (think-block-stripped) response;
# each must capture the answer letter in group 1. Every match across every
# pattern contributes a candidate - more than one distinct letter found makes
# the sample "ambiguous", none found makes it "missing". No patterns
# configured means no extraction is attempted - there is no built-in fallback.
extraction:
  enabled: true
  answer_patterns:
    - 'final\s+answer\s*[:\-]?\s*\(?\s*([A-J])\s*\)?'
    - 'answer\s*[:\-]?\s*\(?\s*([A-J])\s*\)?'
    - 'option\s*[:\-]?\s*\(?\s*([A-J])\s*\)?'
    - '^\s*\(?\s*([A-J])\s*\)?\s*$'

reporting:
  enabled: true
  top_k_worst: 20
  top_k_best: 5
  include_per_sample: false
  per_sample_limit: 1000
  include_text_preview: true
  text_preview_chars: 220

mcq:
  enabled: true
  accuracy:
    enabled: true
  # Averaging is hard-coded to macro in the calculator; not configurable today.
  precision:
    enabled: true
  recall:
    enabled: true
  f1:
    enabled: true
  parsing:
    enabled: true

generative:
  enabled: false

similarity:
  enabled: false

llm_judge:
  enabled: false

quality_checks:
  fail_on_missing_ref_fields: false
  warn_on_parse_failures: true
  warn_on_extraction_ambiguity: true
