profile_id: cognitive.mcq
scope: cognitive
task_type: mcq

enabled: true

# Per-value breakdowns for whatever grouping fields the dataset defines -
# auto-discovered, not named here.
enable_grouping: true

# Whether parsing-diagnostic counts (success/failure/ambiguous rates) appear
# in output. Parsing itself always runs; this only toggles the report.
include_parsing_summary: true

# Ordered regex patterns tried against the response; each must capture the
# answer letter in group 1. Multiple distinct letters found -> "ambiguous";
# none found -> "missing".
extraction:
  answer_patterns:
    - 'final\s+answer\s*[:\-]?\s*\(?\s*([A-J])\s*\)?'
    - 'answer\s*[:\-]?\s*\(?\s*([A-J])\s*\)?'
    - 'option\s*[:\-]?\s*\(?\s*([A-J])\s*\)?'
    - '^\s*\(?\s*([A-J])\s*\)?\s*$'

reporting:
  enabled: true
  top_k_worst: 20
  top_k_best: 5
  include_per_sample: false
  per_sample_limit: 1000
  include_text_preview: true
  text_preview_chars: 220

mcq:
  enabled: true
  accuracy: true
  # Averaging is hard-coded to macro; not configurable today.
  precision: true
  recall: true
  f1: true
  # Predicted-letter vs. correct-letter distribution - surfaces a model
  # leaning on one option regardless of the question, which accuracy alone
  # can hide.
  label_bias: true

llm_judge:
  enabled: false

quality_checks:
  fail_on_missing_ref_fields: false
