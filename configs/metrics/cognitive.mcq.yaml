profile_id: cognitive.mcq
scope: cognitive
task_type: mcq

enabled: true

# Auto-discovers whatever grouping fields the dataset defines.
enable_grouping: true

# Parsing always runs; this only toggles whether success/failure counts are reported.
include_parsing_summary: true

extraction:
  answer_patterns:
    - 'final\s+answer\s*[:\-]?\s*\(?\s*([A-J])\s*\)?'
    - 'answer\s*[:\-]?\s*\(?\s*([A-J])\s*\)?'
    - 'option\s*[:\-]?\s*\(?\s*([A-J])\s*\)?'
    - '^\s*\(?\s*([A-J])\s*\)?\s*$'

reporting:
  enabled: true
  top_k_worst: 20
  top_k_best: 5
  include_per_sample: false
  per_sample_limit: 1000
  include_text_preview: true
  text_preview_chars: 220

mcq:
  enabled: true
  accuracy: true
  precision: true  # averaging is hard-coded to macro
  recall: true
  f1: true
  label_bias: true  # predicted vs. correct letter distribution

llm_judge:
  enabled: false

quality_checks:
  fail_on_missing_ref_fields: false
