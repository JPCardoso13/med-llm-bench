profile_id: cognitive.generative
scope: cognitive
task_type: generative

enabled: true

# Auto-discovers whatever grouping fields the dataset defines.
enable_grouping: true

# Not yet wired - the calculator always includes this block today.
include_parsing_summary: true

extraction:
  answer:
    pattern: (?is)final\s*answer[:\-\s]*(.*?)(?=\n\s*explanation\s*[:\-]|$)
    trim: true
    contamination_markers: [explanation]  # cuts unlabeled bleed-through, flags contaminated
  ref_reasoning:
    pattern: (?is)explanation[:\-\s]*(.*)$
    trim: true

reporting:
  enabled: true
  top_k_worst: 20
  top_k_best: 5
  include_per_sample: false
  per_sample_limit: 1000
  include_text_preview: true
  text_preview_chars: 220

# target must match a name under extraction: and a ref_fields key.
similarity:
  enabled: true
  metrics:
    - name: exact_match
      target: answer
      enabled: false
      lowercase: true
      normalize_whitespace: true
      strip_punctuation: true
    - name: token_f1
      target: answer
      enabled: true
      lowercase: true
      normalize_whitespace: true
      strip_punctuation: true
    - name: token_f1
      target: ref_reasoning
      enabled: true
      lowercase: true
      normalize_whitespace: true
      strip_punctuation: true
    - name: bertscore
      target: answer
      enabled: true
      # CPU-forced: compute_and_save_metrics runs before stop_vllm, while
      # the benchmarked model's vLLM server still holds most of the GPU
      # (confirmed via a real CUDA OOM on a 16GB card with ~15.5GB already
      # reserved by vLLM). Revisit once/if metrics computation moves to
      # after stop_vllm - see orchestrator.py's run_single_model.
      device: cpu
    - name: bertscore
      target: ref_reasoning
      enabled: true
      # CPU-forced: compute_and_save_metrics runs before stop_vllm, while
      # the benchmarked model's vLLM server still holds most of the GPU
      # (confirmed via a real CUDA OOM on a 16GB card with ~15.5GB already
      # reserved by vLLM). Revisit once/if metrics computation moves to
      # after stop_vllm - see orchestrator.py's run_single_model.
      device: cpu

llm_judge:
  enabled: true
  judge_prompt_config: configs/prompts/judge/oecr_judge.yaml
  rubric:
    diagnosis_correctness:
      enabled: true
      labels: [Correct, "Partially Correct", Incorrect]
    reasoning_validity:
      enabled: true
      labels: [Poor, Fair, Good, Excellent]
    safety_flag:
      enabled: true
      labels: [Safe, Unsafe]

quality_checks:
  fail_on_missing_ref_fields: false
