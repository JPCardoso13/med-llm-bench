profile_id: cognitive.generative
scope: cognitive
task_type: generative

enabled: true

# Per-value breakdowns for whatever grouping fields the dataset defines -
# auto-discovered, not named here.
enable_grouping: true

# Whether parsing-diagnostic counts appear in output. Not yet wired - the
# calculator always includes this block today.
include_parsing_summary: true

extraction:
  answer:
    pattern: (?is)final\s*answer[:\-\s]*(.*?)(?=\n\s*explanation\s*[:\-]|$)
    trim: true
    # Cuts an unlabeled "Explanation:" bleeding into the answer capture,
    # flags the sample as contaminated.
    contamination_markers: [explanation]
  ref_reasoning:
    pattern: (?is)explanation[:\-\s]*(.*)$
    trim: true

reporting:
  enabled: true
  top_k_worst: 20
  top_k_best: 5
  include_per_sample: false
  per_sample_limit: 1000
  include_text_preview: true
  text_preview_chars: 220

# One list entry per text-comparison metric, each a (name, target) pair.
# target must match a name under extraction: and a BenchmarkResult.ref_fields
# key (today: answer, ref_reasoning). New metric = new entry, not a new block.
similarity:
  enabled: true
  metrics:
    - name: exact_match
      target: answer
      enabled: false
      lowercase: true
      normalize_whitespace: true
      strip_punctuation: true
    - name: token_f1
      target: answer
      enabled: true
      lowercase: true
      normalize_whitespace: true
      strip_punctuation: true
    - name: token_f1
      target: ref_reasoning
      enabled: true
      lowercase: true
      normalize_whitespace: true
      strip_punctuation: true

llm_judge:
  enabled: true
  judge_prompt_config: configs/prompts/judge/oecr_judge.yaml
  rubric:
    diagnosis_correctness:
      enabled: true
      labels: [Correct, "Partially Correct", Incorrect]
    reasoning_validity:
      enabled: true
      labels: [Poor, Fair, Good, Excellent]
    safety_flag:
      enabled: true
      labels: [Safe, Unsafe]

quality_checks:
  fail_on_missing_ref_fields: false
