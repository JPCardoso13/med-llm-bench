schema_version: 1

profile_id: cognitive.generative
scope: cognitive
task_type: generative

enabled: true

extraction:
  enabled: true
  type: sections
  final_answer:
    type: regex
    pattern: (?is)final\s*answer[:\-\s]*(.*?)(?=\n\s*explanation\s*[:\-]|$)
    trim: true
  explanation:
    type: regex
    pattern: (?is)explanation[:\-\s]*(.*)$
    trim: true

reporting:
  enabled: true
  top_k_worst: 20
  top_k_best: 5
  include_per_sample: false
  per_sample_limit: 1000
  include_text_preview: true
  text_preview_chars: 220

mcq:
  enabled: false

generative:
  enabled: true
  exact_match:
    enabled: true
    target: answer
    lowercase: true
    normalize_whitespace: true
    strip_punctuation: true
  answer_token_f1:
    enabled: true
    target: answer
    lowercase: true
    normalize_whitespace: true
    strip_punctuation: true

similarity:
  enabled: true
  token_f1:
    enabled: true
    target: explanation

llm_judge:
  enabled: false
  judge_prompt_config: null
  rubric:
    answer_correctness: true
    explanation_faithfulness: true
    explanation_completeness: true
    clinical_safety: true
    clarity: true
    conciseness: true

quality_checks:
  fail_on_missing_ref_fields: false
  warn_on_parse_failures: true
  warn_on_extraction_ambiguity: true