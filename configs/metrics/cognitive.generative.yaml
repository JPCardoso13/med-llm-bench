schema_version: 1

profile_id: cognitive.generative
scope: cognitive
task_type: generative

enabled: true

extraction:
  enabled: true
  final_answer:
    pattern: (?is)final\s*answer[:\-\s]*(.*?)(?=\n\s*explanation\s*[:\-]|$)
    trim: true
    # If the model bleeds an unlabeled "Explanation:" into the final-answer
    # capture, cut it there and flag the sample as contaminated.
    contamination_markers: [explanation]
  explanation:
    pattern: (?is)explanation[:\-\s]*(.*)$
    trim: true

reporting:
  enabled: true
  top_k_worst: 20
  top_k_best: 5
  include_per_sample: false
  per_sample_limit: 1000
  include_text_preview: true
  text_preview_chars: 220

mcq:
  enabled: false

generative:
  enabled: true
  exact_match:
    enabled: true
    target: answer
    lowercase: true
    normalize_whitespace: true
    strip_punctuation: true
  answer_token_f1:
    enabled: true
    target: answer
    lowercase: true
    normalize_whitespace: true
    strip_punctuation: true

similarity:
  enabled: true
  token_f1:
    enabled: true
    target: explanation

llm_judge:
  enabled: true
  judge_prompt_config: configs/prompts/judge/oecr_judge.yaml
  rubric:
    diagnosis_correctness:
      enabled: true
      labels: [Correct, "Partially Correct", Incorrect]
    reasoning_validity:
      enabled: true
      labels: [Poor, Fair, Good, Excellent]
    safety_flag:
      enabled: true
      labels: [Safe, Unsafe]

quality_checks:
  fail_on_missing_ref_fields: false
  warn_on_parse_failures: true
  warn_on_extraction_ambiguity: true