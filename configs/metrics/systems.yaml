profile_id: systems
scope: systems

enabled: true


latency:
  enabled: true
  fields:
    - total_latency_ms
    - ttft_ms
  percentiles: [50, 90, 95, 99]
  aggregates:
    - mean
    - std
    - min
    - max

inter_token_latency:
  enabled: true
  source_field: inter_token_latencies_ms
  request_level_stats: [mean, p50, p95, p99]
  percentiles: [50, 90, 95, 99]
  aggregates:
    - mean
    - min
    - max

throughput:
  enabled: true
  fields:
    - e2e_throughput
    - prefill_throughput
    - decoding_throughput
  percentiles: [50, 90, 95, 99]
  aggregates:
    - mean
    - std
    - min
    - max

usage:
  enabled: true
  fields:
    - backend_metrics.usage.prompt_tokens
    - backend_metrics.usage.completion_tokens
    - backend_metrics.usage.total_tokens
  aggregates:
    - mean
    - min
    - max
    - sum

# Perplexity of the model's own generated tokens (exp of mean negative
# log-probability) - a confidence/calibration signal, not a correctness
# one. Requires the backend to request logprobs (openai_backend.py does by
# default); absent for any raw result predating that change.
generation:
  enabled: true
  fields:
    - backend_metrics.perplexity
  aggregates:
    - mean
    - min
    - max

# Two field sets below because the two telemetry collectors produce
# different key names for the same underlying stats: remote_http (SLURM/
# multi-node, via nvidia_smi_agent.py) reports cluster-wide aggregates
# under *_cluster names plus sample_count_total/node_count_reporting;
# nvidia_smi (local/single-machine, in-process) reports the same stats
# without the _cluster suffix and has no per-node concept at all. Whichever
# collector wasn't used for a given run just shows up as a missing field
# (harmless - same as any other backend-capability gap) rather than picking
# one shape and leaving the other silently broken. True per-node breakdown
# for multi-node runs (remote_http's node_results) isn't representable here
# yet - that needs a group_by-style mechanism, not a fixed field list.
telemetry:
  enabled: true
  fields:
    - backend_metrics.system.sample_count_total
    - backend_metrics.system.node_count_reporting
    - backend_metrics.system.gpu_utilization_pct_avg_cluster
    - backend_metrics.system.gpu_utilization_pct_max_cluster
    - backend_metrics.system.gpu_memory_used_mb_avg_cluster
    - backend_metrics.system.gpu_memory_used_mb_max_cluster
    - backend_metrics.system.sample_count
    - backend_metrics.system.gpu_utilization_pct_avg
    - backend_metrics.system.gpu_utilization_pct_max
    - backend_metrics.system.gpu_memory_used_mb_avg
    - backend_metrics.system.gpu_memory_used_mb_max
  aggregates:
    - mean
    - min
    - max

quality_checks:
  fail_on_missing_fields: false
