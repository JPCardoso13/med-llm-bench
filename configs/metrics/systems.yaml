profile_id: systems
scope: systems

enabled: true


latency:
  enabled: true
  fields:
    - total_latency_ms
    - ttft_ms
  percentiles: [50, 90, 95, 99]
  aggregates:
    - mean
    - std
    - min
    - max

inter_token_latency:
  enabled: true
  source_field: inter_token_latencies_ms
  request_level_stats: [mean, p50, p95, p99]
  percentiles: [50, 90, 95, 99]
  aggregates:
    - mean
    - min
    - max

throughput:
  enabled: true
  fields:
    - e2e_throughput
    - prefill_throughput
    - decoding_throughput
  percentiles: [50, 90, 95, 99]
  aggregates:
    - mean
    - std
    - min
    - max

usage:
  enabled: true
  fields:
    - backend_metrics.usage.prompt_tokens
    - backend_metrics.usage.completion_tokens
    - backend_metrics.usage.total_tokens
  aggregates:
    - mean
    - min
    - max
    - sum

# Perplexity of the model's own generated tokens (exp of mean negative
# log-probability) - a confidence/calibration signal, not a correctness
# one. Requires the backend to request logprobs (openai_backend.py does by
# default); absent for any raw result predating that change.
generation:
  enabled: true
  fields:
    - backend_metrics.perplexity
  aggregates:
    - mean
    - min
    - max

telemetry:
  enabled: true
  fields:
    - backend_metrics.system.sample_count_total
    - backend_metrics.system.node_count_reporting
    - backend_metrics.system.gpu_utilization_pct_avg_cluster
    - backend_metrics.system.gpu_utilization_pct_max_cluster
    - backend_metrics.system.gpu_memory_used_mb_avg_cluster
    - backend_metrics.system.gpu_memory_used_mb_max_cluster
  aggregates:
    - mean
    - min
    - max

quality_checks:
  fail_on_missing_fields: false
