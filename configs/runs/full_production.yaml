# The real benchmarking run: all 3 tasks, all 8 production models.
# Used by the HPC SLURM wrappers (scripts/orchestration/*.sh) by default -
# expresses "run everything" as an explicit selection rather than relying on
# whatever happens to be sitting in configs/tasks/ and configs/models/.
tasks:
  - cdkr
  - oecr
  - src

models:
  - gemma3_27b_it
  - llama3_1_70b
  - llama3_openbiollm_70b
  - medgemma_27b_it
  - qwen3_6_27b
  - qwen3_6_27b_awq_int4
  - qwen3_6_35b_a3b
  - qwen3_6_35b_a3b_awq_4bit
