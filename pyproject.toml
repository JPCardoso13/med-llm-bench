[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-bench"
version = "0.1.0"
description = "LLM medical benchmarking schemas and data ingestion utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.0",
  "datasets>=2.0",
  "rouge-score>=0.1.2",
]

[project.optional-dependencies]
# llm_bench.reporting (charts/tables from outputs/reports/) is the only part
# of the package that needs these - kept optional so a bare install for
# running benchmarks doesn't pull in a plotting stack it never uses.
viz = [
  "pandas>=2.0",
  "matplotlib>=3.8",
  "tabulate>=0.9",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_bench*"]
